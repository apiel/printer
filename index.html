<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bytecintia Printer</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="toolbar">
    <div class="group">
      <button id="connect">Connect</button>
      <span id="status" class="muted">Not connected</span>
    </div>

    <div class="group">
      <label>Page <select id="preset"></select></label>
    </div>

    <div class="group">
      <button data-tool="select" class="active" title="Select and move items">Select</button>
      <button id="add-text" title="Add a text block">+ Text</button>
      <button id="add-image" title="Add an image">+ Image</button>
      <button data-tool="line" title="Drag on the page to draw a line">Line</button>
      <button id="import-pdf" title="Import a PDF">PDF…</button>
      <button id="delete-item" title="Delete the selected item">Delete</button>
    </div>

    <div class="group" id="page-nav">
      <button id="prev-page">◀</button>
      <span id="page-label" class="muted">Page 1 / 1</span>
      <button id="next-page">▶</button>
      <button id="add-page">+ Page</button>
      <button id="remove-page">Remove page</button>
    </div>

    <div class="group push-right">
      <button id="print" class="primary" data-needs-printer disabled>Print</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div id="sheet" class="sheet">
        <canvas id="page-canvas"></canvas>
        <div id="margin-guide" class="margin-guide"></div>
        <div id="sel" class="sel hidden"><div id="handle-se" class="handle" title="Drag to resize"></div></div>
        <div id="len-handle" class="len-handle" title="Drag to change the minimum length"></div>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <h2>Selected item</h2>
        <p id="no-selection" class="muted">Click an item on the page to edit it.</p>
        <div id="fields" class="hidden">
          <div class="field"><label for="p-x">X (mm)</label><input id="p-x" type="number" step="0.5"></div>
          <div class="field"><label for="p-y">Y (mm)</label><input id="p-y" type="number" step="0.5"></div>
          <div class="field" data-for="text image line"><label for="p-w">Width (mm)</label><input id="p-w" type="number" step="0.5" min="1"></div>
          <div class="field" data-for="image"><label for="p-h">Height (mm)</label><input id="p-h" type="number" step="0.5" min="1"></div>
          <div class="field" data-for="line"><label for="p-thick">Thickness (dots)</label><input id="p-thick" type="number" min="1" max="60"></div>
          <div class="field" data-for="text"><label for="p-text">Text</label><textarea id="p-text"></textarea></div>
          <div class="field" data-for="text"><label for="p-size">Size (dots)</label><input id="p-size" type="number" min="8" max="200"></div>
          <div class="field" data-for="text"><label for="p-bold">Bold</label><input id="p-bold" type="checkbox"></div>
          <div class="field" data-for="text"><label for="p-align">Align</label>
            <select id="p-align">
              <option value="0">Left</option>
              <option value="1">Center</option>
              <option value="2">Right</option>
            </select>
          </div>
          <button id="p-delete" class="danger">Delete item</button>
        </div>
      </div>

      <div class="card">
        <h2>Page sizes</h2>
        <p id="page-info" class="muted"></p>
        <div class="field"><label for="pr-name">Name</label><input id="pr-name" type="text"></div>
        <div class="field"><label for="pr-width">Width (mm)</label><input id="pr-width" type="number" min="10" step="1"></div>
        <div class="field"><label for="pr-roll">Endless roll</label><input id="pr-roll" type="checkbox"></div>
        <div class="field"><label for="pr-length">Length (mm)</label><input id="pr-length" type="number" min="10" step="1"></div>
        <div class="field"><label for="pr-ml">Left margin (mm)</label><input id="pr-ml" type="number" min="0" step="0.5"></div>
        <div class="field"><label for="pr-mr">Right margin (mm)</label><input id="pr-mr" type="number" min="0" step="0.5"></div>
        <div class="field"><label for="pr-mt">Top margin (mm)</label><input id="pr-mt" type="number" min="0" step="0.5"></div>
        <div class="field"><label for="pr-mb">Bottom margin (mm)</label><input id="pr-mb" type="number" min="0" step="0.5"></div>
        <div class="row">
          <button id="pr-update">Update this size</button>
          <button id="pr-new">Save as new</button>
          <button id="pr-delete" class="danger">Delete</button>
        </div>
        <div class="row">
          <button id="pr-a4" class="ghost">Fill A4</button>
          <button id="pr-reset" class="ghost">Reset to defaults</button>
        </div>
        <p class="muted">Width is the printable width: 48 mm for a 58 mm roll.</p>
      </div>

      <div class="card">
        <h2>Printer</h2>
        <div class="field"><label for="head">Head width</label>
          <select id="head">
            <option value="384">58 mm printer (384 dots)</option>
            <option value="576">80 mm printer (576 dots)</option>
          </select>
        </div>
        <div class="field"><label for="cut">Cut after page</label><input id="cut" type="checkbox"></div>
        <p class="muted">Pages wider than the printer head are scaled down to fit.</p>
      </div>

      <div class="card">
        <div class="row between"><h2>Log</h2><button id="clear-log" class="ghost">Clear</button></div>
        <div id="log"></div>
      </div>
    </aside>
  </main>

  <input type="file" id="file-image" accept="image/*" hidden>
  <input type="file" id="file-pdf" accept="application/pdf" hidden>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
